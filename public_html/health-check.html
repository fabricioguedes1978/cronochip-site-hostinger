<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Verificação Cronochip</title><style>body{margin:0;background:#102b35;color:#f5f8f9;font:16px Arial}main{max-width:620px;margin:8vh auto;padding:24px}.check{padding:14px;margin:10px 0;border:1px solid #38515b;border-radius:8px;background:#18323e}.ok{border-color:#5ee487;color:#5ee487}.bad{border-color:#ff6961;color:#ff6961}button{padding:12px;border:0;border-radius:6px;background:#5ee487;color:#071109;font-weight:bold}</style></head><body><main><h1>Verificação Cronochip</h1><p>Confirme estes itens antes da troca do endereço.</p><button onclick="run()">VERIFICAR AGORA</button><div id="out"></div></main><script>async function check(label,path,test){const el=document.createElement('div');el.className='check';el.textContent=label+'…';out.append(el);try{const r=await fetch(path,{cache:'no-store'}),j=await r.json();if(!r.ok||!test(j))throw 0;el.classList.add('ok');el.textContent='✓ '+label}catch{el.classList.add('bad');el.textContent='✕ '+label}}async function run(){out.innerHTML='';await check('Banco e serviço online','/api/health',j=>j.ok);await check('Lista pública de eventos','/api/events',j=>Array.isArray(j.events));const r=await fetch('/api/events').then(x=>x.json()).catch(()=>({events:[]}));if(r.events[0])await check('Página e dados do primeiro evento','/api/event?slug='+encodeURIComponent(r.events[0].slug),j=>Boolean(j.event));else{const e=document.createElement('div');e.className='check';e.textContent='○ Cadastre um evento pelo programa para concluir o teste.';out.append(e)}}</script></body></html>
